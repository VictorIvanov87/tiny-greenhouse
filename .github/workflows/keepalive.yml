name: Keepalive

# OPTIONAL. Pings /api/health every 5 min so an Azure App Service F1 (Free) tier
# app doesn't sleep after 20 min of HTTP idle. Sleeping kills the IoT Hub
# consumer started in src/app.ts, which causes telemetry to queue in IoT Hub
# instead of landing in Firestore.
#
# Only needed if you deploy the backend to a free-tier Azure app. Set the repo
# variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables)
# to your deployed backend origin, or delete this workflow entirely.

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 min — minimum granularity GitHub Actions allows
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health
        run: |
          curl --max-time 30 --silent --show-error \
            --output /dev/null \
            --write-out 'HTTP %{http_code} in %{time_total}s\n' \
            "${{ vars.BACKEND_URL }}/api/health"
