name: Deploy

# Builds the backend and frontend on every push to main and deploys them to
# Azure App Service (backend) and Firebase Hosting (frontend).
#
# Before this works on your own fork, set these in Settings → Secrets and
# variables → Actions, and replace the placeholders below:
#   Secrets:  AZURE_CREDENTIALS, FIREBASE_SERVICE_ACCOUNT,
#             VITE_API_BASE_URL, VITE_FIREBASE_API_KEY,
#             VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#             VITE_FIREBASE_APP_ID
#   Placeholders below:  YOUR_AZURE_WEBAPP_NAME, YOUR_FIREBASE_PROJECT_ID

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Azure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Package dist + data + package files for deployment
      - name: Prepare deployment package
        run: |
          mkdir -p deploy/dist deploy/data
          cp dist/app.js deploy/dist/
          cp -r data/mock deploy/data/
          cp -r ../data/rag deploy/data/
          cp package.json package-lock.json deploy/

      - name: Install production deps in deploy folder
        run: cd deploy && npm ci --omit=dev

      - name: Zip deployment package
        run: cd deploy && zip -r ../deploy.zip .

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: YOUR_AZURE_WEBAPP_NAME
          package: backend/deploy.zip

  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: YOUR_FIREBASE_PROJECT_ID
